server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: banbif-challenge-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
