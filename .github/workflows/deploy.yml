name: CI/CD Pipeline - Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.export-image-uri.outputs.image_uri }}
      repository_url: ${{ steps.ecr-infra.outputs.repository_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Provision ECR with Terraform
        id: ecr-infra
        working-directory: infra/01-ecr
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ecr/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform validate
          terraform apply -auto-approve -var="aws_region=${{ secrets.AWS_REGION }}"
          REPO_URL=$(terraform output -raw repository_url)
          echo "repository_url=$REPO_URL" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image
        working-directory: app
        run: |
          REPO_URL="${{ steps.ecr-infra.outputs.repository_url }}"
          IMAGE_TAG="${{ github.sha }}"

          echo "Building Docker image for commit: $IMAGE_TAG"
          docker build -t "$REPO_URL:$IMAGE_TAG" -t "$REPO_URL:latest" .

          echo "Pushing Docker images to Amazon ECR..."
          docker push "$REPO_URL:$IMAGE_TAG"
          docker push "$REPO_URL:latest"

      - name: Export Image URI Output
        id: export-image-uri
        run: |
          IMAGE_URI="${{ steps.ecr-infra.outputs.repository_url }}:${{ github.sha }}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Image successfully built and tagged as $IMAGE_URI"

  deploy-ecs:
    name: Deploy to Amazon ECS Fargate
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Provision / Update ECS Cluster & Service
        id: ecs-infra
        working-directory: infra/02-ecs-cluster
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ecs-cluster/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"
          terraform validate
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="image_uri=${{ needs.build-and-push.outputs.image_uri }}"

          PUBLIC_URL=$(terraform output -raw public_endpoint_url)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "public_endpoint_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "alb_dns_name=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "ALB Public Endpoint URL: $PUBLIC_URL"

      - name: Validate Deployment Health
        run: |
          PUBLIC_URL="${{ steps.ecs-infra.outputs.public_endpoint_url }}"
          echo "Waiting 45 seconds for ECS Fargate tasks to register and pass ALB target group health checks..."
          sleep 45

          echo "Testing public endpoint: $PUBLIC_URL"
          curl --retry 5 --retry-delay 10 -f -s -i "$PUBLIC_URL" || {
            echo "Health verification failed after retries."
            exit 1
          }
          echo "Endpoint successfully validated with HTTP 200 OK!"
